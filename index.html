<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#07111d" />
  <meta name="description" content="WORLDSEED — awaken tiny worlds by slingshotting a living seed through their gravity wells." />
  <meta property="og:title" content="WORLDSEED" />
  <meta property="og:description" content="Choose a route, slingshot a living seed through gravity wells and awaken a connected system of tiny worlds." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://southers.github.io/WORLDSEED/submission/thumbnail.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>WORLDSEED</title>
  <link rel="stylesheet" href="./src/style.css?v=20260813-7a" />

  <!--
    Buildless import map for the five-day jam. Three.js is pinned and vendored so startup
    does not depend on a third-party CDN.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three.module.min.js?v=0.179.1"
      }
    }
  </script>
</head>
<body>
  <main id="GameShell">
    <canvas id="GameCanvas" aria-label="WORLDSEED game canvas"></canvas>

    <header class="hud hud--top">
      <div class="brand">
        <span class="brand__title">WORLDSEED</span>
        <span class="brand__subtitle">bring the little worlds back to life</span>
      </div>

      <div class="counter" aria-live="polite">
        <span class="counter__label">WORLDS</span>
        <span id="WorldCounter" class="counter__value">0 / 4</span>
      </div>
    </header>

    <section id="InstructionPanel" class="instruction-panel">
      <strong id="InstructionTitle">Choose GROVE or EMBER</strong>
      <span id="InstructionBody">Grab the seed, pull away from a gold-ringed world, then release.</span>
    </section>

    <section id="AimPanel" class="aim-panel" hidden aria-live="polite">
      <span id="AimLabel">PULL</span>
      <span class="aim-panel__meter" aria-hidden="true">
        <span id="AimPowerFill" class="aim-panel__fill"></span>
      </span>
      <span id="AimPowerValue">0%</span>
    </section>

    <section id="StatusToast" class="status-toast" aria-live="polite"></section>

    <div id="RouteLabels" class="route-labels" aria-hidden="true">
      <span class="route-label"></span>
      <span class="route-label"></span>
      <span class="tactical-label tactical-label--seedstone"></span>
      <span class="tactical-label tactical-label--hazard"></span>
    </div>

    <section id="VictoryPanel" class="victory-panel" hidden>
      <span class="victory-panel__eyebrow">FIRST LIGHT NETWORK RESTORED</span>
      <h1>Everything is growing again.</h1>
      <p>Five worlds. One seed. The path to the Worldheart is open.</p>
      <button id="PlayAgainButton" type="button">Play again</button>
    </section>

    <footer class="hud hud--bottom">
      <span>Drag + release to launch</span>
      <div class="hud__actions">
        <button id="AudioButton" type="button" aria-pressed="false">Audio on [M]</button>
        <button id="ResetButton" type="button">Reset [R]</button>
      </div>
    </footer>
  </main>

  <script type="module" src="./src/main.js?v=20260813-7a"></script>
</body>
</html>
